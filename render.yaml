services:
  - type: keyvalue
    name: e2ee-note-vault-store
    plan: free
    maxmemoryPolicy: noeviction   # we manage expiry ourselves via SETEX TTLs; don't let Redis evict early under memory pressure
    ipAllowList: []                # internal connections only — never expose this to the public internet

  - type: web
    name: e2ee-cyber-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        # Replace with your actual Render frontend URL
        value: https://e2ee-net.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: e2ee-note-vault-store
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: e2ee-cyber-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Replace with your actual Render backend URL
        value: https://e2ee-net-backend.onrender.com
    routes:
      # SPA fallback: any path with no matching static asset serves index.html.
      # This is what makes /view/<id> load the React app instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true